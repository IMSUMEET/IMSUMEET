<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sumeet Suryawanshi — real-time systems, control planes, and full-stack products">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="45%" stop-color="#0F1A28"/>
      <stop offset="100%" stop-color="#0C2228"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="72%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="chartClip"><rect x="712" y="150" width="330" height="96"/></clipPath>
    <style>
      .pulse  { animation: pulse 2.6s ease-in-out infinite; }
      .pulse2 { animation: pulse 2.6s ease-in-out infinite 0.6s; }
      .pulse3 { animation: pulse 2.6s ease-in-out infinite 1.2s; }
      .drift  { animation: drift 7s ease-in-out infinite; }
      .drift2 { animation: drift 8.5s ease-in-out infinite reverse; }
      .dash   { stroke-dasharray: 7 11; animation: dashmove 2s linear infinite; }
      .dash2  { stroke-dasharray: 4 9; animation: dashmove 2.8s linear infinite reverse; }
      .float1 { animation: floaty 5.5s ease-in-out infinite; }
      .float2 { animation: floaty 6.5s ease-in-out infinite 1s; }
      .float3 { animation: floaty 4.8s ease-in-out infinite 0.4s; }
      .bar  { transform-box: fill-box; transform-origin: center bottom; animation: barH 2.4s ease-in-out infinite; }
      .bar2 { transform-box: fill-box; transform-origin: center bottom; animation: barH 2.4s ease-in-out infinite 0.35s; }
      .bar3 { transform-box: fill-box; transform-origin: center bottom; animation: barH 2.4s ease-in-out infinite 0.7s; }
      .bar4 { transform-box: fill-box; transform-origin: center bottom; animation: barH 2.4s ease-in-out infinite 1.05s; }
      .packet  { animation: courier 6s linear infinite; }
      .packet2 { animation: courier2 7.5s linear infinite; }
      .wave   { stroke-dasharray: 620; stroke-dashoffset: 620; animation: draw 4.5s ease-in-out infinite; }
      .cursorblink { animation: blink 1.1s steps(1) infinite; }
      @keyframes pulse   { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes drift   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes dashmove { to { stroke-dashoffset: -72; } }
      @keyframes floaty  { 0%,100% { transform: translate(0,0); opacity: 0.5; } 50% { transform: translate(6px,-10px); opacity: 1; } }
      @keyframes barH    { 0%,100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }
      @keyframes courier { 0% { transform: translate(0,0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translate(210px, 55px); opacity: 0; } }
      @keyframes courier2 { 0% { transform: translate(0,0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate(-160px, 70px); opacity: 0; } }
      @keyframes draw    { 0% { stroke-dashoffset: 620; } 55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
      @keyframes blink   { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="26" fill="url(#orb)"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="24.5" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- grid -->
  <g opacity="0.14" stroke="#64748B" stroke-width="1">
    <path d="M40 44 H1160 M40 96 H1160 M40 148 H1160 M40 200 H1160 M40 252 H1160"/>
    <path d="M120 34 V266 M240 34 V266 M360 34 V266 M480 34 V266 M600 34 V266 M720 34 V266 M840 34 V266 M960 34 V266 M1080 34 V266"/>
  </g>

  <!-- live line chart -->
  <g clip-path="url(#chartClip)">
    <path d="M712 246 L712 210 L742 196 L772 214 L802 174 L832 188 L862 158 L892 178 L922 150 L952 168 L982 140 L1012 160 L1042 150 L1042 246 Z" fill="url(#chart)" opacity="0.7"/>
    <path class="wave" d="M712 210 L742 196 L772 214 L802 174 L832 188 L862 158 L892 178 L922 150 L952 168 L982 140 L1012 160 L1042 150"
          fill="none" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sorting bars -->
  <g transform="translate(724,255)" opacity="0.9">
    <rect class="bar"  x="0"  y="-40" width="10" height="40" rx="2" fill="#14B8A6"/>
    <rect class="bar2" x="16" y="-58" width="10" height="58" rx="2" fill="#38BDF8"/>
    <rect class="bar3" x="32" y="-48" width="10" height="48" rx="2" fill="#F59E0B"/>
    <rect class="bar4" x="48" y="-68" width="10" height="68" rx="2" fill="#14B8A6"/>
    <rect class="bar"  x="64" y="-44" width="10" height="44" rx="2" fill="#38BDF8"/>
    <rect class="bar2" x="80" y="-62" width="10" height="62" rx="2" fill="#F59E0B"/>
  </g>

  <!-- network -->
  <g class="drift" filter="url(#soft)">
    <path class="dash"  d="M900 70 L1000 108 L1120 84 L1074 156 L968 172 L900 70" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.7"/>
    <path class="dash2" d="M934 132 L1034 74 L1140 140" fill="none" stroke="#14B8A6" stroke-width="2" opacity="0.5"/>
    <circle class="pulse"  cx="900"  cy="70"  r="5" fill="#14B8A6"/>
    <circle class="pulse2" cx="1000" cy="108" r="5" fill="#38BDF8"/>
    <circle class="pulse3" cx="1120" cy="84"  r="5" fill="#F59E0B"/>
    <circle class="pulse"  cx="1074" cy="156" r="5" fill="#38BDF8"/>
    <circle class="pulse2" cx="968"  cy="172" r="5" fill="#14B8A6"/>
    <circle class="pulse3" cx="1034" cy="74"  r="4.5" fill="#F59E0B"/>
    <circle class="packet"  cx="900"  cy="70" r="3.5" fill="#F8FAFC"/>
    <circle class="packet2" cx="1120" cy="84" r="3"   fill="#F59E0B"/>
  </g>

  <!-- particles -->
  <g class="drift2" opacity="0.9">
    <circle class="float1" cx="700" cy="235" r="2.8" fill="#F59E0B"/>
    <circle class="float2" cx="732" cy="258" r="2.2" fill="#38BDF8"/>
    <circle class="float3" cx="676" cy="262" r="1.8" fill="#14B8A6"/>
    <circle class="float1" cx="1176" cy="46" r="2"   fill="#38BDF8"/>
    <circle class="float2" cx="1158" cy="250" r="2.4" fill="#14B8A6"/>
  </g>

  <!-- text -->
  <text x="58" y="112" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.03em">Sumeet Suryawanshi</text>
  <rect x="60" y="130" width="230" height="4" rx="2" fill="url(#accent)"/>
  <text x="60" y="176" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600">
    <tspan fill="#14B8A6">$</tspan> <tspan fill="#94A3B8">build</tspan> <tspan fill="#38BDF8">real-time-systems</tspan><tspan class="cursorblink" fill="#F59E0B" dx="4">_</tspan>
  </text>
  <text x="60" y="214" fill="#64748B" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">Control planes · Event-driven backends · Full-stack products</text>

  <!-- stack chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">
    <g transform="translate(60,236)"><rect width="66"  height="24" rx="12" fill="#14B8A6" opacity="0.14"/><text x="33" y="16" fill="#5EEAD4" text-anchor="middle">Java</text></g>
    <g transform="translate(134,236)"><rect width="78"  height="24" rx="12" fill="#38BDF8" opacity="0.14"/><text x="39" y="16" fill="#7DD3FC" text-anchor="middle">Spring</text></g>
    <g transform="translate(220,236)"><rect width="72"  height="24" rx="12" fill="#38BDF8" opacity="0.14"/><text x="36" y="16" fill="#7DD3FC" text-anchor="middle">React</text></g>
    <g transform="translate(300,236)"><rect width="66"  height="24" rx="12" fill="#F59E0B" opacity="0.14"/><text x="33" y="16" fill="#FCD34D" text-anchor="middle">Kafka</text></g>
    <g transform="translate(374,236)"><rect width="90"  height="24" rx="12" fill="#38BDF8" opacity="0.14"/><text x="45" y="16" fill="#7DD3FC" text-anchor="middle">Postgres</text></g>
  </g>
</svg>
